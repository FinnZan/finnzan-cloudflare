<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DELL</title>
	<style>
		*{box-sizing:border-box;margin:0;padding:0}
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0b0b;color:#f5f5f5;padding:24px}
		.wrap{margin:0 auto}
		h1{font-size:20px;margin-bottom:12px;display:inline}
		.header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
		select{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#f5f5f5;font-size:13px}
		.meta{opacity:.8;margin-bottom:16px;font-size:12px;line-height:1.4}
		.card{border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.04);padding:12px}
		canvas{width:100%;height:520px}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
	<script src="/kv-charts.js" defer></script>
</head>
<body>
	<div class="wrap">
		<div class="header">
			<h1>DELL</h1>
			<select id="limit">
				<option value="5000">5,000</option>
				<option value="10000" selected>10,000</option>
				<option value="20000">20,000</option>
			</select>
		</div>
		<div class="meta" id="meta"></div>
		<div class="card">
			<canvas id="chart"></canvas>
		</div>
	</div>
</body>
</html>
